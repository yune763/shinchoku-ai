# Render Blueprint — 進捗管理AI を無料Webサービスとしてデプロイする。
# データは Firestore（または Upstash Redis）に保存するので、再起動・再デプロイでも消えない。
# 使い方: Render ダッシュボード → New → Blueprint → このリポジトリを選択。
#   その後、FIREBASE_SERVICE_ACCOUNT を実際の値に設定する（sync:false のため手入力）。
services:
  - type: web
    name: shinchoku-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # Firestore サービスアカウント鍵JSON（文字列）。永続データの保存先。ダッシュボードで値を入れる。
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIRESTORE_COLLECTION
        value: "shinchoku"
      # 代替: Upstash Redis を使う場合はこちらに入れる（Firestoreを使うなら空でよい）。
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # 任意: APIを閉じたい場合のトークン（設定すると外部アクセスに Bearer 必須）。
      - key: API_TOKEN
        sync: false
